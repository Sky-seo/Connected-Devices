<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>323 Hart House</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scriptSky.js"></script>
    <script src="scriptBilly.js"></script>
    <script src="scriptDJ.js"></script>
</head>
<body>
    <div class="desktop">
        <header class="header">
            <h1>323 Hart House</h1>
        </header>
        
        <main class="main">
            <!-- User Card 1 -->
            <div class="user-card">
                <h2>User</h2>
                <div class="temperature-display">
                    <div class="temperature-gauge">
                        <img src="https://www.figma.com/api/mcp/asset/03851d37-360a-4a4c-81ac-4679f1de9891" alt="cold" class="gauge-image">
                        <img src="https://www.figma.com/api/mcp/asset/3060129c-56ee-4dd2-bafb-0b95109b0a17" alt="hot" class="gauge-image hot1">
                        <div class="felt-temperature">
                            <img src="https://www.figma.com/api/mcp/asset/ba0a10c1-4904-4bbc-9f78-6fb33f4d4641" alt="circle" class="circle-bg">
                            <div class="temperature-info">
                                <p class="label">Felt Temperature</p>
                                <p class="value"><span id="felt1">--</span>°C</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">                      
                        <p class="stat-label">Temperature</p>
                        <p class="stat-value"><span id="temp1">--</span>°C</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Humidity</p>
                        <p class="stat-value"><span id="humid1">--</span>%</p>
                    </div>
                </div>
            </div>

            <!-- User Card 2 -->
            <div class="user-card">
                <h2>User</h2>
                <div class="temperature-display">
                    <div class="temperature-gauge">
                        <img src="https://www.figma.com/api/mcp/asset/03851d37-360a-4a4c-81ac-4679f1de9891" alt="cold" class="gauge-image">
                        <img src="https://www.figma.com/api/mcp/asset/3060129c-56ee-4dd2-bafb-0b95109b0a17" alt="hot" class="gauge-image hot2">
                        <div class="felt-temperature">
                            <img src="https://www.figma.com/api/mcp/asset/ba0a10c1-4904-4bbc-9f78-6fb33f4d4641" alt="circle" class="circle-bg">
                             <div class="temperature-info">
                                <p class="label">Felt Temperature</p>
                                <p class="value"><span id="felt2">--</span>°C</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <p class="stat-label">Temperature</p>
                        <p class="stat-value"><span id="temp2">--</span>°C</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Humidity</p>
                        <p class="stat-value"><span id="humid2">--</span>%</p>
                    </div>
                </div>
            </div>

            <!-- User Card 3 -->
            <div class="user-card">
                <h2>User</h2>
                <div class="temperature-display">
                    <div class="temperature-gauge">
                        <img src="https://www.figma.com/api/mcp/asset/03851d37-360a-4a4c-81ac-4679f1de9891" alt="cold" class="gauge-image">
                        <img src="https://www.figma.com/api/mcp/asset/3060129c-56ee-4dd2-bafb-0b95109b0a17" alt="hot" class="gauge-image hot3">
                        <div class="felt-temperature">
                            <img src="https://www.figma.com/api/mcp/asset/ba0a10c1-4904-4bbc-9f78-6fb33f4d4641" alt="circle" class="circle-bg">
                            <div class="temperature-info">
                                <p class="label">Felt Temperature</p>
                                <p class="value"><span id="felt3">--</span>°C</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <p class="stat-label">Temperature</p>
                        <p class="stat-value"><span id="temp3">--</span>°C</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Humidity</p>
                        <p class="stat-value"><span id="humid3">--</span>%</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
